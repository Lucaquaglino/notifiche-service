
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifiche-service
  namespace: microservices
  labels:
    app: notifiche-service

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: notifiche-service

  template:
    metadata:
      labels:
        app: notifiche-service

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: notifiche-service
          image: ghcr.io/lucaquaglino/notifiche-service:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "192.168.188.184:9094"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
