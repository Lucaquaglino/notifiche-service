
# HTTP
%dev.quarkus.http.port=8081
%prod.quarkus.http.port=8080


# REST Client - sviluppo locale sul Mac
%dev.quarkus.rest-client.pratiche-api.url=http://localhost:8080

# REST Client - Kubernetes K3s
%prod.quarkus.rest-client.pratiche-api.url=http://pratiche-service.microservices.svc.cluster.local:8080

# Timeout della chiamata REST
quarkus.rest-client.pratiche-api.connect-timeout=2000
quarkus.rest-client.pratiche-api.read-timeout=5000


# Kafka - sviluppo locale Mac
%dev.kafka.bootstrap.servers=192.168.188.184:9094

# Kafka - Kubernetes
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Kafka Consumer
mp.messaging.incoming.pratiche-events.connector=smallrye-kafka
mp.messaging.incoming.pratiche-events.topic=pratiche-events
mp.messaging.incoming.pratiche-events.group.id=notifiche-service
mp.messaging.incoming.pratiche-events.auto.offset.reset=earliest
mp.messaging.incoming.pratiche-events.value.deserializer=it.homelab.kafka.PraticaCreataDeserializer
quarkus.messaging.request-scoped.enabled=true

# Kafka Consumer - test locale
%dev.mp.messaging.incoming.pratiche-events.group.id=notifiche-service-rest-test
%dev.mp.messaging.incoming.pratiche-events.auto.offset.reset=latest
